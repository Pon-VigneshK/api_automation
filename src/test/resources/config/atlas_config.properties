## Configuration
# ------------------------> # Thumb rule: Please follow lowercase for keywords in the config properties file # <------------------------ ####
# Define the base URL
baseurl=https://atlas-dev.op.healthcare/api/v1/atlas-practice
# Define the environment (Example: QA/DEV/Staging)
env=Dev
runmode=remote
# Dynamic report config (no) - The report will have a name based on the current date and time, plus an index.htm index.
# Dynamic report config (yes) - The report will have a name as index.html.
overridereports=yes
# Retry test configured (yes) - The test will be retry based on retries in RetryFailedTests.
# Retry test configured (no) - The test will not be run again.
retry=yes
logresponse=yes
auditlogdb=true
# Define the Headers
acceptheader=
contenttypeheader=
organizationidheader=1
practiceidheader=1
# Define the AuthType (Example: OAuth 2.0/Basic/APIkeys)
authtype=oauth2
